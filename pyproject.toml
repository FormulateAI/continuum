[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuum-context-hub"
version = "0.2.0"
description = "The Universal AI Memory Layer — cross-tool, semantic, team-shareable"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Continuum AI", email = "founders@continuum.ai" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "requests>=2.28.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.20.0",
  "pydantic>=2.0.0",
  "typer>=0.9.0",
  "sqlite-utils>=3.30",
  "chromadb>=0.4.0",
  "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
test = ["pytest>=7.0.0", "httpx>=0.24.0"]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "httpx>=0.24.0",
  "ruff>=0.1.0",
  "mypy>=1.6.0",
  "types-requests",
]

[project.scripts]
continuum = "continuum.cli.hub:app"

[project.urls]
Documentation = "https://docs.continuum.ai"
Issues = "https://github.com/continuum-ai/continuum/issues"
Source = "https://github.com/continuum-ai/continuum"

[tool.hatch.build.targets.wheel]
packages = ["continuum"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
